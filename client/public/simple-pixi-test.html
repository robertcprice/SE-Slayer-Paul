<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple PixiJS Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f0f0f0;
        }
        #canvas-container {
            width: 200px;
            height: 200px;
            border: 2px solid #333;
            margin: 20px 0;
            background: white;
        }
        #status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            background: #fff;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>🎮 Simple PixiJS Test</h1>
    <div id="status">Loading...</div>
    <div id="canvas-container"></div>
    <button onclick="testRedSquare()">Test Red Square</button>
    <button onclick="testBlueCircle()">Test Blue Circle</button>
    <button onclick="testColorAnimation()">Test Color Animation</button>

    <script type="module">
        import { Application, Graphics } from 'https://cdn.skypack.dev/pixi.js@8';

        let app;
        let container;

        function updateStatus(message) {
            document.getElementById('status').textContent = message;
            console.log(message);
        }

        async function initPixi() {
            try {
                updateStatus('Initializing PixiJS...');
                
                app = new Application();
                
                await app.init({
                    width: 200,
                    height: 200,
                    backgroundAlpha: 0
                });
                
                container = document.getElementById('canvas-container');
                container.appendChild(app.canvas);
                
                updateStatus('✅ PixiJS initialized successfully!');
                
            } catch (error) {
                updateStatus(`❌ Error: ${error.message}`);
                console.error('PixiJS initialization error:', error);
            }
        }

        window.testRedSquare = function() {
            if (!app) {
                updateStatus('❌ PixiJS not initialized');
                return;
            }

            try {
                app.stage.removeChildren();
                
                const graphics = new Graphics();
                graphics.rect(50, 50, 100, 100);
                graphics.fill(0xff0000);
                
                app.stage.addChild(graphics);
                updateStatus('✅ Red square rendered');
                
            } catch (error) {
                updateStatus(`❌ Error rendering square: ${error.message}`);
            }
        };

        window.testBlueCircle = function() {
            if (!app) {
                updateStatus('❌ PixiJS not initialized');
                return;
            }

            try {
                app.stage.removeChildren();
                
                const graphics = new Graphics();
                graphics.circle(100, 100, 50);
                graphics.fill(0x0000ff);
                
                app.stage.addChild(graphics);
                updateStatus('✅ Blue circle rendered');
                
            } catch (error) {
                updateStatus(`❌ Error rendering circle: ${error.message}`);
            }
        };

        window.testColorAnimation = function() {
            if (!app) {
                updateStatus('❌ PixiJS not initialized');
                return;
            }

            try {
                app.stage.removeChildren();
                
                const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff];
                let colorIndex = 0;
                
                const graphics = new Graphics();
                app.stage.addChild(graphics);
                
                const animate = () => {
                    graphics.clear();
                    graphics.circle(100, 100, 40);
                    graphics.fill(colors[colorIndex]);
                    
                    colorIndex = (colorIndex + 1) % colors.length;
                };
                
                app.ticker.add(animate);
                
                setTimeout(() => {
                    app.ticker.remove(animate);
                    updateStatus('✅ Animation test completed');
                }, 3000);
                
                updateStatus('✅ Animation test running (3 seconds)...');
                
            } catch (error) {
                updateStatus(`❌ Error in animation: ${error.message}`);
            }
        };

        // Initialize when page loads
        initPixi();
    </script>
</body>
</html>
